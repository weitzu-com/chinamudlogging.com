name: WordPress migration candidate
on:
  pull_request:
    paths: ['wordpress/**', 'src/data/**', 'src/scripts/funnel.ts', 'workers/funnel/**', 'tests/**', 'public/**', '.github/workflows/wordpress.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: npm ci
      - name: Rebuild shared anonymous measurement client
        run: |
          node wordpress/scripts/build-funnel.mjs
          git diff --exit-code -- wordpress/plugin/cml-core/funnel.js
          npm run test:funnel
      - name: PHP and JavaScript syntax
        run: |
          find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check wordpress/plugin/cml-core/inquiry.js
          node --check wordpress/plugin/cml-core/editor.js
      - name: Validate content and draft translation integrity
        run: |
          python3 wordpress/scripts/check-full-translations.py --require-approved
          python3 wordpress/scripts/prepare.py
          python3 wordpress/scripts/check-bundle.py
      - name: Verify catalogue schema and sitemap boundaries in isolated WordPress
        run: |
          python3 wordpress/extensions/test-search-quality.py
          python3 wordpress/extensions/test-sensor-selection.py
      - name: Multilingual inquiry boundary regression
        run: python3 wordpress/tests/run-ego-qa.py
      - name: Postlaunch deadline and evidence guards
        run: |
          python3 wordpress/tests/test-postlaunch-review.py
          python3 wordpress/tests/test-index-diagnosis.py
      - name: Catalogue pagination SEO boundaries
        run: python3 wordpress/tests/test-pagination-seo.py
      - name: Source-backed content correction and guarded publication regression
        run: |
          python3 wordpress/corrections/source-content-20261105/build-review.py
          git diff --exit-code -- wordpress/corrections/source-content-20261105/reviewed-manifest.json
          python3 wordpress/corrections/source-content-20261105/check-review.py
          python3 wordpress/tests/run-source-content-review.py
      - name: Package candidate
        run: python3 wordpress/scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: chinamudlogging-wordpress-candidate
          path: ~/.cache/chinamudlogging-wordpress/release/
          retention-days: 14
